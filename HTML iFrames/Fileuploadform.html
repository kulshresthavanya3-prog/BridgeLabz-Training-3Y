<!DOCTYPE html>
<html>
<head>
    <title>File Upload Form</title>
</head>
<body>

    <h2>File Upload Form</h2>

    <form>
        <label>Select File:</label>
        <input type="file" name="file" accept=".jpg, .png" required>
        <br><br>

        <p>Only JPG and PNG files are allowed.</p>

        <input type="submit" value="Upload">
    </form>

</body>
</html>
