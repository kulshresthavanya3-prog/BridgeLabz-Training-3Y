<!DOCTYPE html>
<html>
<head>
    <title>My City Map</title>
</head>
<body>

<h2>My City</h2>

<!-- loading="lazy" loads the map only when it is needed/near the visible area -->
<iframe
    src="https://www.google.com/maps?q=Mathura&output=embed"
    title="Google Map showing Mathura"
    width="600"
    height="450"
    loading="lazy">
</iframe>

</body>
</html>
