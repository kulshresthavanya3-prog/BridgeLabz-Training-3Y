<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="st.css">
</head>
<body>
  
<div class="card">

    <!-- Product Image Section -->
    <div class="image-section">

        <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcQXEGg8NqWeSrEWHcvA9dVgnyH73-K4MI7wU8dFZxEBmpMcNOLFTiLhsJMpgCy0cQKInP814U-0d23qahcMkQUYvN7v2Ca9" class="shoe">

        <div class="discount">20% OFF</div>

        <div class="heart">♡</div>

    </div> 

    <!-- Product Details -->
    <div class="details">

        <div class="category">SPORTS SHOES</div>

        <h2>Premium Running Shoes</h2>

        <div class="rating">
            ★ ★ ★ ★ ★
            <span>(120)</span>
        </div>

        <div class="price">
            ₹1,999
            <del>₹2,499</del>
        </div>

        <button>Add to Cart</button>

    </div>

</div>

</body>
</html>
