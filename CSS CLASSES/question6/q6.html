<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="animation-box">
            <div class="moving-box"></div>
            <p>Moving Box</p>
        </div>

        <div class="animation-box">
            <div class="ball"></div>
            <p>Bouncing Ball</p>
        </div>

        <div class="animation-box">
            <h1 class="color-text">CSS Animation</h1>
            <p>Color Changing Text</p>
        </div>

    </div>

</body>
</html>
