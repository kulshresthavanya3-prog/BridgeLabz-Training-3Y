<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Tooltip Demonstration</h1>

    <div class="container">

        <!-- Tooltip 1 -->
        <div class="tooltip">
            HTML
            <span class="tooltip-text">HyperText Markup Language</span>
        </div>

        <!-- Tooltip 2 -->
        <div class="tooltip">
            CSS
            <span class="tooltip-text">Cascading Style Sheets</span>
        </div>

        <!-- Tooltip 3 -->
        <div class="tooltip">
            Java
            <span class="tooltip-text">A programming language</span>
        </div>

        <!-- Tooltip 4 -->
        <div class="tooltip">
            Python
            <span class="tooltip-text">A popular programming language</span>
        </div>

    </div>

</body>
</html>
