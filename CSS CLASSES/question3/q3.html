<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Showcase</h1>

    <div class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=1" alt="Mountain">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Mountain</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=2" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=3" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=4" alt="City">
                <div class="overlay"></div>
            </div>
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=5" alt="Lake">
                <div class="overlay"></div>
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?random=6" alt="Desert">
                <div class="overlay"></div>
            </div>
            <figcaption>Beautiful Desert</figcaption>
        </figure>

    </div>

</body>
</html>
