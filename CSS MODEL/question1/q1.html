<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Borders and Padding Demonstration</h1>

    <div class="container">

        <div class="box solid">
            <h2>Solid Border</h2>
            <p>Padding: 10px</p>
        </div>

        <div class="box dashed">
            <h2>Dashed Border</h2>
            <p>Padding: 20px</p>
        </div>

        <div class="box double">
            <h2>Double Border</h2>
            <p>Padding: 30px</p>
        </div>

        <div class="box groove">
            <h2>Groove Border</h2>
            <p>Padding: 40px</p>
        </div>

        <div class="box rounded">
            <h2>Rounded Corners</h2>
            <p>Border Radius: 20px</p>
        </div>

    </div>

</body>
</html>
