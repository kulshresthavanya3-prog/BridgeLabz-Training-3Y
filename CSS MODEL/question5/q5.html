<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Advanced CSS Selectors</h1>

    <!-- Attribute Selector Examples -->
    <div class="form">
        <h2>Form</h2>

        <input type="text" placeholder="Enter your name">

        <input type="email" placeholder="Enter your email">

        <input type="password" placeholder="Enter password">

        <button>Submit</button>
    </div>

    <!-- Link examples -->
    <div class="links">
        <h2>Useful Links</h2>

        <a href="https://www.google.com">Google</a>
        <a href="https://www.github.com">GitHub</a>
        <a href="http://example.com">Example</a>
    </div>

    <!-- List for pseudo-class and combinator examples -->
    <div class="items">
        <h2>Item List</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>Python</li>
            <li>Java</li>
        </ul>
    </div>

    <!-- Combinator examples -->
    <div class="content">
        <h2>Combinators</h2>

        <p>This paragraph is inside the content div.</p>

        <div>
            <p>This paragraph is inside a nested div.</p>
        </div>

        <p>Another paragraph.</p>
        <p>Last paragraph.</p>
    </div>

</body>
</html>
