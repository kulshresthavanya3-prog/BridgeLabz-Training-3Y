<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>CSS Gradient Page</h2>
    </header>

    <main>

        <section class="linear">
            <h1>Linear Gradient</h1>
            <p>
                This section uses a linear gradient background.
                The colors change gradually from one side to another.
            </p>
        </section>

        <section class="radial">
            <h1>Radial Gradient</h1>
            <p>
                This section uses a radial gradient background.
                The colors spread outward from the center.
            </p>
        </section>

    </main>

    <footer>
        <p>© 2026 Gradient Practice Page</p>
    </footer>

</body>
</html>
