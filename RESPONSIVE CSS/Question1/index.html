<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Filter Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Image Filter Gallery</h1>

    <div class="gallery">

        <div class="item">
            <img src="image1.jpg" class="blur" alt="Nature">
            <p>Blur</p>
        </div>

        <div class="item">
            <img src="image2.jpg" class="grayscale" alt="Mountain">
            <p>Grayscale</p>
        </div>

        <div class="item">
            <img src="image3.jpg" class="sepia" alt="Beach">
            <p>Sepia</p>
        </div>

        <div class="item">
            <img src="image4.jpg" class="brightness" alt="Forest">
            <p>Brightness</p>
        </div>

        <div class="item">
            <img src="image5.jpg" class="contrast" alt="City">
            <p>Contrast</p>
        </div>

        <div class="item">
            <img src="image6.jpg" class="hue" alt="Flowers">
            <p>Hue Rotate</p>
        </div>

    </div>

</body>
</html>
