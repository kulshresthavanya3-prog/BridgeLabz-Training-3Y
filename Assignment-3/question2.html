
<!DOCTYPE html>
<html>
<body>
<script>
"use strict";

const employees = [
    { name: "Amit", salary: "45000", years: "5" },
    { name: "Sara", salary: "38000", years: "2" },
    { name: "Kiran", salary: "52000", years: "7" }
];

try {
    for (let i = 0; i < employees.length; i++) {
        let name = employees[i].name;
        let salary = Number(employees[i].salary);
        let years = Number(employees[i].years);

        if (!name || !Number.isFinite(salary) ||
            !Number.isFinite(years)) {
            throw new Error("Invalid or missing employee data");
        }

        let bonus;

        if (years > 3) {
            bonus = salary * 0.1;
        } else {
            bonus = salary * 0.05;
        }

        console.log(`Employee: ${name}`);
        console.log(`Salary: ₹${salary}`);
        console.log(`Experience: ${years} years`);
        console.log(`Bonus: ₹${bonus}`);
        console.log(`Total Salary: ₹${salary + bonus}`);
        console.log("------------------------");
    }
} catch (error) {
    console.log("Error:", error.message);
}
</script>
</body>
</html>
