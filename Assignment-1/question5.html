
<!DOCTYPE html>
<html>
<head>
    <title>Weather Advisor</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            display: inline-block;
        }

        input {
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Weather Advisor</h2>

        <input type="number" id="temperature" placeholder="Temperature (°C)">
        <br>

        <label>Is it raining?</label>
        <select id="rain">
            <option value="no">No</option>
            <option value="yes">Yes</option>
        </select>
        <br><br>

        <input type="number" id="wind" placeholder="Wind speed (km/h)">
        <br>

        <button onclick="checkWeather()">Get Advice</button>

        <h3 id="result"></h3>
    </div>

    <script>
        function checkWeather() {
            let temperature = Number(document.getElementById("temperature").value);
            let isRaining = document.getElementById("rain").value === "yes";
            let windSpeed = Number(document.getElementById("wind").value);
            let advice = "";

            if (document.getElementById("temperature").value === "" ||
                document.getElementById("wind").value === "" ||
                temperature < -100 || windSpeed < 0) {
                alert("Please enter valid temperature and wind speed.");
                return;
            }

            if (isRaining) {
                advice = "Stay indoors with hot coffee.";
            } else if (temperature > 35) {
                advice = "Go swimming.";
            } else if (temperature < 15 && windSpeed > 20) {
                advice = "Too cold and windy — stay home.";
            } else {
                advice = "Perfect day for a walk.";
            }

            document.getElementById("result").textContent = advice;
        }
    </script>

</body>
</html>
