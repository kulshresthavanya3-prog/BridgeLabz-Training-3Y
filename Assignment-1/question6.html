
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Discount Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            display: inline-block;
        }

        input {
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Shopping Discount Calculator</h2>

        <input type="number" id="amount" placeholder="Enter purchase amount">
        <br>

        <button onclick="calculateDiscount()">Calculate Discount</button>

        <h3 id="original"></h3>
        <h3 id="discount"></h3>
        <h3 id="final"></h3>
    </div>

    <script>
        function calculateDiscount() {
            let total = Number(document.getElementById("amount").value);
            let discount = 0;

            if (document.getElementById("amount").value === "" || total < 0) {
                alert("Please enter a valid purchase amount.");
                return;
            }

            if (total >= 10000) {
                discount = 25;
            } else if (total >= 5000) {
                discount = 15;
            } else if (total >= 2000) {
                discount = 5;
            } else {
                discount = 0;
            }

            let discountAmount = Math.round(total * discount / 100);
            let finalPrice = Math.round(total - discountAmount);

            document.getElementById("original").textContent =
                `Original Total: ₹${total}`;

            document.getElementById("discount").textContent =
                `Discount: ${discount}% (₹${discountAmount})`;

            document.getElementById("final").textContent =
                `Final Price: ₹${finalPrice}`;
        }
    </script>

</body>
</html>
