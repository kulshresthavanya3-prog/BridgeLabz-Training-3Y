<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-container">

    <div class="card">

        <div class="front">
            <img src="https://via.placeholder.com/250x150" alt="Image">
            <h2>My Card</h2>
        </div>

        <div class="back">
            <p>
                This is the description of the card.
                The card flips when you hover over it.
            </p>
        </div>

    </div>

</div>

</body>
</html>
