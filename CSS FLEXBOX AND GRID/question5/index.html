<!DOCTYPE html>
<html>
<head>
    <title>Pricing Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199/month</h3>
            <p>Basic Features</p>

        </div>

        <div class="card popular">
            <h2>Premium</h2>
            <h3>₹499/month</h3>
            <p>More Features</p>

        </div>

        <div class="card">
            <h2>Pro</h2>
            <h3>₹999/month</h3>
            <p>All Features</p>
            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
