<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <!-- Image 1 -->
        <div class="photo">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">

            <div class="caption">
                Beautiful Mountain
            </div>
        </div>


        <!-- Image 2 -->
        <div class="photo">
            <img src="https://picsum.photos/id/1016/500/350" alt="Nature">

            <div class="caption">
                Beautiful Nature
            </div>
        </div>


        <!-- Image 3 -->
        <div class="photo">
            <img src="https://picsum.photos/id/1025/500/350" alt="Dog">

            <div class="caption">
                Cute Dog
            </div>
        </div>


        <!-- Image 4 -->
        <div class="photo">
            <img src="https://picsum.photos/id/1035/500/350" alt="River">

            <div class="caption">
                Peaceful River
            </div>
        </div>


        <!-- Image 5 -->
        <div class="photo">
            <img src="https://picsum.photos/id/1043/500/350" alt="Forest">

            <div class="caption">
                Green Forest
            </div>
        </div>


        <!-- Image 6 -->
        <div class="photo">
            <img src="https://picsum.photos/id/106/500/350" alt="Lake">

            <div class="caption">
                Beautiful Lake
            </div>
        </div>

    </div>

</body>
</html>
