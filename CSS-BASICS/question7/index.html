<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <form>

            <h1>Contact Us</h1>

            <!-- Name -->
            <div class="field">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>


            <!-- Email -->
            <div class="field">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <!-- Subject -->
            <div class="field">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >
            </div>


            <!-- Message -->
            <div class="field">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required
                ></textarea>
            </div>


            <!-- Submit button -->
            <button type="submit">Send Message</button>

        </form>

    </div>

</body>
</html>
