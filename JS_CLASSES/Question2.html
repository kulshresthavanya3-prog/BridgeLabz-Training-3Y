
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            display: block;
            padding: 10px;
            margin: 8px 0;
            width: 280px;
            border: 2px solid gray;
        }

        .valid {
            border-color: green;
        }

        .invalid {
            border-color: red;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<h2>Student Registration Form</h2>

<form id="studentForm">
    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter name">
    <p id="nameError" class="error"></p>

    <label>Email:</label>
    <input type="text" id="email" placeholder="example@domain.com">
    <p id="emailError" class="error"></p>

    <label>Phone:</label>
    <input type="text" id="phone" placeholder="10-digit phone number">
    <p id="phoneError" class="error"></p>

    <label>Password:</label>
    <input type="password" id="password" placeholder="Enter password">
    <p id="passwordError" class="error"></p>

    <button type="submit">Register</button>
</form>

<p id="message"></p>

<script>
"use strict";

const form = document.getElementById("studentForm");

const patterns = {
    name: /^[A-Za-z]+$/,
    email: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
    phone: /^\d{10}$/,
    password: /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S+$/
};

const errors = {
    name: "Name must contain only alphabets.",
    email: "Enter a valid email, e.g. example@domain.com.",
    phone: "Phone must contain exactly 10 digits.",
    password: "Password needs an uppercase letter, a number, and a special character."
};

function validate(field) {
    const input = document.getElementById(field);
    const error = document.getElementById(field + "Error");
    const value = input.value.trim();

    if (patterns[field].test(value)) {
        input.classList.add("valid");
        input.classList.remove("invalid");
        error.textContent = "";
        return true;
    } else {
        input.classList.add("invalid");
        input.classList.remove("valid");
        error.textContent = errors[field];
        return false;
    }
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    let isValid = true;

    for (let field of ["name", "email", "phone", "password"]) {
        if (!validate(field)) {
            isValid = false;
        }
    }

    const message = document.getElementById("message");

    if (isValid) {
        message.textContent = "Registration successful!";
        message.style.color = "green";
    } else {
        message.textContent = "Please correct the errors above.";
        message.style.color = "red";
    }
});
</script>

</body>
</html>
