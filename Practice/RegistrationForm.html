<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
   
    <h1 align="center">Student Registration Form</h1>
    <form action="#" method="post">

        <table border="1" align="center" cellpadding="8" cellspacing="0" width="600">
            <tr>
                <th colspan="2" align="center">Registration Form</th>
            </tr>

            <!-- Name Input -->
            <tr>
                <td><label for="name">Name</label></td>
                <td><input id="name" type="text" placeholder="Enter your name" name="name"></td>
            </tr>

            <!-- Password Input -->
            <tr>
                <td><label for="email">Email</label></td>
                <td><input id="email" type="Email" name="Email" placeholder="Enter Email"></td>
            </tr>

            <!-- Phone Input -->
            <tr>
                <td><label for="phone">Phone No.</label></td>
                <td><input id="phone" type="tel" name="phone" placeholder="Enter phone number"></td>
            </tr>

            <!-- Date Input -->
            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td><input id="dob" type="date" name="dob"></td>
            </tr>

            <!-- Gender Section -->
            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <section>
                        <input type="radio" name="gender">
                        <label>Male</label>
                        
                        <input type="radio" name="gender">
                        <label>Female</label>
                       
                        <input type="radio" name="gender">
                        <label>Others</label>
                    </section>
                </td>
            </tr>

            <!-- Skill Select Dropdown -->
            <tr>
                <td><label for="skill">Skill</label></td>
                <td>
                    <select id="skill" name="skill" size="1">
                        <option value="Select Skill" disabled selected hidden></option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                    </select>
                </td>
            </tr>

            <!-- Course Select Dropdown -->
            <tr>
                <td><label for="course">Select Course</label></td>
                <td>
                    <select id="course" name="course" size="1">
                        <option value="Select Course" disabled selected hidden></option>
                        <option value="Bachelors In Science">Bachelors In Science</option>
                        <option value="css">Bachelors In Technology</option>
                        <option value="javascript">Bachelors In Business Administration</option>
                    </select>
                </td>
            </tr>

            <!-- Checkboxes -->
            <tr>
                <td><p style="margin: 0;">Skill</p></td>
                <td>
                    <input id="html" type="checkbox" name="skills" value="html">
                    <label for="html">HTML</label>
                    
                    <input id="css" type="checkbox" name="skills" value="css">
                    <label for="css">CSS</label>
                    
                    <input id="js" type="checkbox" name="skills" value="js">
                    <label for="js">JS</label>
                </td>
            </tr>

            <!-- Address Input -->
            <tr>
                <td><label for="Address">Address</label></td>
                <td><textarea id="Address" name="Address" style="width: 100%; height: 100px; box-sizing: border-box;"></textarea></td>
            </tr>

            <!-- Upload Resume -->
            <tr>
                <td><p style="margin: 0;">Upload Resume</p></td>
                <td>
                    <input type="file" name="file">
                    <!-- <input type="range" max="3" min="0">-->
                    <!--<input type="submit">-->
                </td>
            </tr>

            <!-- Submit Buttons -->
            <tr>
                <td colspan="2" align="center">
                    <button type="Register">Register</button>
                    <button type="Register">Reset</button>
                </td>
            </tr>
        </table>

    </form>
</body>
</html>
