```html
<!DOCTYPE html>
<html>
<head>
    <title>Simple Counter</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
            background-color: lightblue;
        }

        .container {
            background: white;
            padding: 25px;
            margin: auto;
            width: 300px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Counter</h2>
        <h3 id="count">Count: 0</h3>

        <button onclick="increment()">Increment +</button>
        <button onclick="decrement()">Decrement -</button>

        <p id="result"></p>
    </div>

    <script>
        let count = 0;

        function increment() {
            count++;

            function showCount() {
                console.log("Current count:", count);
                document.getElementById("count").innerHTML =
                    "Count: " + count;
            }

            showCount();
        }

        function decrement() {
            count--;

            function showCount() {
                console.log("Current count:", count);
                document.getElementById("count").innerHTML =
                    "Count: " + count;
            }

            showCount();
        }

        // Simulate clicks manually
        increment();
        increment();
        decrement();
    </script>

</body>
</html>
